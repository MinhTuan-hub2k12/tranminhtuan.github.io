<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Life Journal - Premium Animation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --gold: #ffd700;
            --gold-dark: #f7971e;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #08080f;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--gold-dark), var(--gold));
            border-radius: 10px;
        }

        /* ============================================================
           INTRO - CỰC CHẤT
           ============================================================ */
        #introOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #08080f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: introFade 4s ease-in-out forwards;
            pointer-events: none;
        }

        @keyframes introFade {
            0% { opacity: 1; }
            70% { opacity: 1; }
            90% { opacity: 0.8; }
            100% { opacity: 0; visibility: hidden; }
        }

        #introOverlay .ring-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        #introOverlay .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: ringSpin 3s ease-in-out infinite;
        }

        #introOverlay .ring:nth-child(1) {
            width: 100%;
            height: 100%;
            border-top: 2px solid var(--gold);
            border-right: 2px solid var(--gold);
            animation-duration: 2.5s;
        }

        #introOverlay .ring:nth-child(2) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-bottom: 2px solid var(--gold-dark);
            border-left: 2px solid var(--gold-dark);
            animation-duration: 3.5s;
            animation-direction: reverse;
        }

        #introOverlay .ring:nth-child(3) {
            width: 40%;
            height: 40%;
            top: 30%;
            left: 30%;
            border-top: 2px solid #ff6b6b;
            border-right: 2px solid #ff6b6b;
            animation-duration: 2s;
        }

        @keyframes ringSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        #introOverlay .logo-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 56px;
            animation: logoPulse 1.5s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes logoPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }

        #introOverlay h1 {
            font-size: 48px;
            font-weight: 900;
            margin-top: 30px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark), var(--gold));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 2s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        #introOverlay .sub {
            color: rgba(255, 255, 255, 0.1);
            font-size: 13px;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: 300;
        }

        #introOverlay .progress {
            width: 300px;
            height: 3px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            margin-top: 25px;
            overflow: hidden;
            position: relative;
        }

        #introOverlay .progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
            background-size: 200%;
            border-radius: 10px;
            animation: progressLoad 3.5s ease-in-out forwards, shimmerBar 1.5s linear infinite;
        }

        @keyframes progressLoad {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes shimmerBar {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        #introOverlay .particles-intro {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        #introOverlay .particles-intro span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: particleRise 4s ease-in-out infinite;
        }

        @keyframes particleRise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 16px 30px;
            background: rgba(8, 8, 15, 0.7);
            backdrop-filter: blur(30px) saturate(1.5);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateY(-100%);
            animation: slideDownHeader 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 4s forwards;
        }

        @keyframes slideDownHeader {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 900;
        }

        .header .logo .icon {
            font-size: 28px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(-2deg); }
        }

        .header .logo .text {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .header-actions button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            opacity: 0;
            transition: opacity 0.4s;
            border-radius: 50px;
        }

        .header-actions button:hover::before {
            opacity: 1;
        }

        .header-actions button:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.1);
        }

        .header-actions button:hover * {
            position: relative;
            z-index: 1;
        }

        .header-actions .btn-primary {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            color: #08080f;
            font-weight: 700;
            border: none;
        }

        .header-actions .btn-primary::before {
            display: none;
        }

        .header-actions .btn-primary:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 40px rgba(255, 215, 0, 0.2);
        }

        /* ============================================================
           HERO
           ============================================================ */
        .hero {
            margin-top: 80px;
            padding: 60px 30px 50px;
            text-align: center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(40px) scale(0.98);
            animation: heroIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 4.2s forwards;
        }

        @keyframes heroIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, rgba(255, 215, 0, 0.03), transparent 70%);
            animation: heroGlow 6s ease-in-out infinite alternate;
        }

        @keyframes heroGlow {
            0% { transform: scale(1) rotate(0deg); opacity: 0.5; }
            100% { transform: scale(1.5) rotate(10deg); opacity: 1; }
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-size: 60px;
            font-weight: 900;
            line-height: 1.1;
            background: linear-gradient(135deg, #fff 20%, var(--gold) 60%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: heroText 3s ease-in-out infinite;
        }

        @keyframes heroText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .hero p {
            color: rgba(255, 255, 255, 0.2);
            font-size: 18px;
            margin-top: 15px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .hero .stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 30px;
        }

        .hero .stats .stat {
            text-align: center;
            position: relative;
        }

        .hero .stats .stat .number {
            font-size: 36px;
            font-weight: 900;
            color: var(--gold);
            display: inline-block;
            animation: countPulse 2s ease-in-out infinite;
        }

        @keyframes countPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .hero .stats .stat .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2px;
            font-weight: 400;
        }

        .hero .stats .stat::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.2;
        }

        /* ============================================================
           FILTERS
           ============================================================ */
        .filters {
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 0 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 4.4s forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .filters button {
            padding: 10px 26px;
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            background: var(--glass);
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 13px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .filters button:hover {
            background: rgba(255, 215, 0, 0.05);
            border-color: rgba(255, 215, 0, 0.1);
            color: rgba(255, 255, 255, 0.7);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .filters button.active {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.15);
            color: var(--gold);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.03);
        }

        /* ============================================================
           GRID
           ============================================================ */
        .grid-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px 80px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        /* ============================================================
           MEMORY CARD - PREMIUM
           ============================================================ */
        .memory-card {
            background: rgba(255, 255, 255, 0.01);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateY(60px) scale(0.95) rotateX(5deg);
            position: relative;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .memory-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1) rotateX(0deg);
        }

        .memory-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.05);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(255, 215, 0, 0.02);
        }

        .memory-card .image-wrapper {
            position: relative;
            height: 280px;
            overflow: hidden;
            background: linear-gradient(135deg, #111118, #1a1a2a);
        }

        .memory-card .image-wrapper .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.02);
            font-size: 60px;
            transition: all 0.6s;
        }

        .memory-card:hover .image-wrapper .placeholder {
            transform: scale(1.1);
        }

        .memory-card .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
        }

        .memory-card:hover .image-wrapper img {
            filter: grayscale(60%) contrast(1.2);
            transform: scale(1.08);
        }

        .memory-card .image-wrapper .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: flex-end;
            padding: 24px;
        }

        .memory-card:hover .image-wrapper .overlay {
            opacity: 1;
        }

        .memory-card .image-wrapper .overlay .actions {
            display: flex;
            gap: 12px;
            transform: translateY(20px);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .memory-card:hover .image-wrapper .overlay .actions {
            transform: translateY(0);
        }

        .memory-card .image-wrapper .overlay .actions button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 16px;
        }

        .memory-card .image-wrapper .overlay .actions button:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.2);
            color: var(--gold);
            transform: scale(1.15) translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.1);
        }

        .memory-card .image-wrapper .badge-date {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 6px 18px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--glass-border);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .memory-card .image-wrapper .badge-location {
            position: absolute;
            bottom: 16px;
            left: 16px;
            padding: 6px 18px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .memory-card .card-body {
            padding: 22px 26px 26px;
        }

        .memory-card .card-body .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            transition: color 0.4s;
            color: #fff;
            line-height: 1.3;
        }

        .memory-card:hover .card-body .title {
            color: var(--gold);
        }

        .memory-card .card-body .desc {
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 14px;
            font-weight: 300;
        }

        .memory-card .card-body .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .memory-card .card-body .tags span {
            padding: 4px 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .memory-card .card-body .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid var(--glass-border);
        }

        .memory-card .card-body .footer .emoji {
            font-size: 24px;
            transition: transform 0.4s;
        }

        .memory-card:hover .card-body .footer .emoji {
            transform: scale(1.2) rotate(-5deg);
        }

        .memory-card .card-body .footer .interact {
            display: flex;
            gap: 16px;
        }

        .memory-card .card-body .footer .interact button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 18px;
        }

        .memory-card .card-body .footer .interact button:hover {
            color: var(--gold);
            transform: scale(1.3) translateY(-3px);
        }

        .memory-card .card-body .footer .interact button.liked {
            color: #ff4757;
            animation: heartPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.6); }
            100% { transform: scale(1); }
        }

        /* ============================================================
           FLOATING ACTION BUTTON
           ============================================================ */
        .fab {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 100;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            border: none;
            color: #08080f;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 50px rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0) rotate(180deg);
            animation: fabIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 4.6s forwards;
        }

        @keyframes fabIn {
            0% { opacity: 0; transform: scale(0) rotate(180deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .fab:hover {
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 12px 70px rgba(255, 215, 0, 0.25);
        }

        .fab:active {
            transform: scale(0.9);
        }

        .fab .pulse-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.1);
            animation: fabPulse 2s ease-out infinite;
        }

        @keyframes fabPulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(40px) saturate(1.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: modalFade 0.4s ease-out;
        }

        .modal.active {
            display: flex;
        }

        @keyframes modalFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .modal-box {
            background: linear-gradient(145deg, #12121f, #1a1a2e);
            border-radius: 28px;
            padding: 44px;
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--glass-border);
            animation: modalSlide 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
        }

        @keyframes modalSlide {
            0% { transform: scale(0.8) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-box h2 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .modal-box .sub {
            color: rgba(255, 255, 255, 0.1);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .modal-box .form-group {
            margin-bottom: 18px;
        }

        .modal-box .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .modal-box .form-group input,
        .modal-box .form-group textarea,
        .modal-box .form-group select {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            transition: all 0.4s;
            font-family: 'Plus Jakarta Sans', sans-serif;
            resize: vertical;
        }

        .modal-box .form-group input:focus,
        .modal-box .form-group textarea:focus,
        .modal-box .form-group select:focus {
            border-color: rgba(255, 215, 0, 0.1);
            outline: none;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.02);
        }

        .modal-box .form-group textarea {
            min-height: 80px;
        }

        .modal-box .form-group select option {
            background: #12121f;
            color: #fff;
        }

        .modal-box .form-group .file-upload {
            padding: 30px;
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s;
            color: rgba(255, 255, 255, 0.05);
        }

        .modal-box .form-group .file-upload:hover {
            border-color: rgba(255, 215, 0, 0.05);
            background: rgba(255, 215, 0, 0.02);
        }

        .modal-box .form-group .file-upload input {
            display: none;
        }

        .modal-box .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-box .actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .modal-box .actions button {
            padding: 14px 30px;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .modal-box .actions .cancel {
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--glass-border);
        }

        .modal-box .actions .cancel:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .modal-box .actions .submit {
            flex: 1;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            color: #08080f;
            font-weight: 800;
        }

        .modal-box .actions .submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(255, 215, 0, 0.15);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 120px;
            right: 40px;
            padding: 16px 28px;
            background: rgba(18, 18, 31, 0.9);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            color: #fff;
            transform: translateY(100px) scale(0.9);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .toast i {
            color: var(--gold);
            font-size: 20px;
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }

        .empty-state .icon {
            font-size: 80px;
            opacity: 0.03;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: rgba(255, 255, 255, 0.05);
            font-weight: 300;
            font-size: 22px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .header {
                padding: 12px 20px;
            }
            .header .logo {
                font-size: 20px;
            }
            .hero h1 {
                font-size: 38px;
            }
            .hero .stats {
                gap: 30px;
            }
            .hero .stats .stat .number {
                font-size: 28px;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .modal-box {
                padding: 30px 24px;
            }
            .modal-box .form-row {
                grid-template-columns: 1fr;
            }
            .fab {
                bottom: 30px;
                right: 30px;
                width: 60px;
                height: 60px;
                font-size: 26px;
            }
            .toast {
                bottom: 100px;
                right: 20px;
                left: 20px;
                font-size: 13px;
            }
            .filters {
                padding: 0 20px;
                gap: 8px;
            }
            .filters button {
                padding: 8px 18px;
                font-size: 12px;
            }
            .header-actions button span {
                display: none;
            }
            .header-actions button {
                padding: 8px 14px;
                font-size: 13px;
            }
            #introOverlay .ring-container {
                width: 150px;
                height: 150px;
            }
            #introOverlay .logo-icon {
                font-size: 42px;
            }
            #introOverlay h1 {
                font-size: 32px;
            }
            #introOverlay .progress {
                width: 200px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 28px;
            }
            .hero p {
                font-size: 15px;
            }
            .grid-container {
                padding: 0 15px 60px;
            }
            .memory-card .image-wrapper {
                height: 200px;
            }
            .memory-card .card-body {
                padding: 18px 20px 22px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    INTRO - CỰC CHẤT
    ============================================================ -->
    <div id="introOverlay">
        <div class="particles-intro" id="introParticles"></div>
        <div class="ring-container">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="logo-icon">📖</div>
        </div>
        <h1>Life Journal</h1>
        <div class="sub">Lưu trữ cuộc đời bạn</div>
        <div class="progress">
            <div class="bar"></div>
        </div>
    </div>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header class="header">
        <div class="logo">
            <span class="icon">📖</span>
            <span class="text">Life Journal</span>
        </div>
        <div class="header-actions">
            <button onclick="exportData()">
                <i class="fas fa-download"></i>
                <span>Xuất</span>
            </button>
            <button onclick="importData()">
                <i class="fas fa-upload"></i>
                <span>Nhập</span>
            </button>
            <button class="btn-primary" onclick="openModal()">
                <i class="fas fa-plus"></i>
                <span>Thêm</span>
            </button>
        </div>
    </header>

    <!-- ============================================================
    HERO
    ============================================================ -->
    <section class="hero">
        <div class="hero-content">
            <h1>🌅 Ghi lại khoảnh khắc</h1>
            <p>Mỗi tấm ảnh, mỗi câu chuyện đều là một phần của hành trình</p>
            <div class="stats">
                <div class="stat">
                    <div class="number" id="countDisplay">0</div>
                    <div class="label">Kỷ niệm</div>
                </div>
                <div class="stat">
                    <div class="number" id="likedDisplay">0</div>
                    <div class="label">Yêu thích</div>
                </div>
                <div class="stat">
                    <div class="number" id="categoryDisplay">0</div>
                    <div class="label">Danh mục</div>
                </div>
            </div>
        </div>
    </section>

    <!-- ============================================================
    FILTERS
    ============================================================ -->
    <div class="filters" id="filters">
        <button class="active" data-filter="all">📸 Tất cả</button>
        <button data-filter="travel">✈️ Du lịch</button>
        <button data-filter="life">🌿 Đời sống</button>
        <button data-filter="family">👨‍👩‍👧‍👦 Gia đình</button>
        <button data-filter="food">🍜 Ẩm thực</button>
        <button data-filter="nature">🌲 Thiên nhiên</button>
        <button data-filter="city">🌃 Thành phố</button>
        <button data-filter="favorite">⭐ Yêu thích</button>
    </div>

    <!-- ============================================================
    GRID
    ============================================================ -->
    <div class="grid-container">
        <div class="grid" id="memoryGrid"></div>
    </div>

    <!-- ============================================================
    FAB
    ============================================================ -->
    <button class="fab" onclick="openModal()">
        <span class="pulse-ring"></span>
        <i class="fas fa-plus"></i>
    </button>

    <!-- ============================================================
    MODAL
    ============================================================ -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <h2>✨ Kỷ niệm mới</h2>
            <p class="sub">Lưu lại khoảnh khắc đáng nhớ</p>

            <form id="memoryForm">
                <div class="form-group">
                    <label>📷 Ảnh</label>
                    <div class="file-upload" onclick="document.getElementById('imageInput').click()">
                        <input type="file" id="imageInput" accept="image/*">
                        <div>
                            <i class="fas fa-cloud-upload-alt" style="font-size:28px;display:block;margin-bottom:8px;"></i>
                            <span style="font-size:14px;">Nhấn để tải ảnh lên</span>
                            <span style="display:block;font-size:11px;margin-top:4px;opacity:0.2;">(Tự động chuyển xám)</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>📝 Tiêu đề</label>
                    <input type="text" id="titleInput" placeholder="Ví dụ: Chuyến đi Đà Lạt" required>
                </div>

                <div class="form-group">
                    <label>💬 Mô tả</label>
                    <textarea id="descInput" placeholder="Câu chuyện của bạn..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>📅 Ngày</label>
                        <input type="date" id="dateInput">
                    </div>
                    <div class="form-group">
                        <label>📍 Địa điểm</label>
                        <input type="text" id="locationInput" placeholder="Đà Lạt">
                    </div>
                </div>

                <div class="form-group">
                    <label>🏷️ Danh mục</label>
                    <select id="categoryInput">
                        <option value="travel">✈️ Du lịch</option>
                        <option value="life">🌿 Đời sống</option>
                        <option value="family">👨‍👩‍👧‍👦 Gia đình</option>
                        <option value="food">🍜 Ẩm thực</option>
                        <option value="nature">🌲 Thiên nhiên</option>
                        <option value="city">🌃 Thành phố</option>
                    </select>
                </div>

                <div class="actions">
                    <button type="button" class="cancel" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="submit">
                        <i class="fas fa-save"></i> Lưu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Đã lưu kỷ niệm!</span>
    </div>

    <script>
        // ============================================================
        // 1. INTRO PARTICLES
        // ============================================================
        function createIntroParticles() {
            const container = document.getElementById('introParticles');
            for (let i = 0; i < 30; i++) {
                const span = document.createElement('span');
                span.style.left = Math.random() * 100 + '%';
                span.style.width = (Math.random() * 3 + 2) + 'px';
                span.style.height = span.style.width;
                span.style.animationDuration = (Math.random() * 4 + 3) + 's';
                span.style.animationDelay = (Math.random() * 4) + 's';
                span.style.background = `hsl(${35 + Math.random() * 20}, 80%, ${50 + Math.random() * 30}%)`;
                container.appendChild(span);
            }
        }
        createIntroParticles();

        // ============================================================
        // 2. DATA
        // ============================================================
        let memories = [];
        let currentFilter = 'all';
        let editingId = null;

        const sampleMemories = [{
            id: 1,
            title: '🌅 Bình minh trên biển Mũi Né',
            description: 'Khoảnh khắc bình minh tuyệt đẹp trên bãi biển Mũi Né, cảm giác bình yên đến lạ.',
            date: '2024-01-15',
            location: 'Mũi Né, Việt Nam',
            category: 'travel',
            emoji: '🌅',
            liked: false,
            image: null
        }, {
            id: 2,
            title: '🍜 Phở Hà Nội đúng điệu',
            description: 'Món phở bò truyền thống tại Hà Nội - hương vị khó quên.',
            date: '2024-02-20',
            location: 'Hà Nội',
            category: 'food',
            emoji: '🍜',
            liked: false,
            image: null
        }, {
            id: 3,
            title: '🏔️ Trekking Sapa mùa lúa chín',
            description: 'Chuyến trekking qua những thửa ruộng bậc thang vàng ươm tại Sapa.',
            date: '2024-03-10',
            location: 'Sapa, Việt Nam',
            category: 'nature',
            emoji: '🏔️',
            liked: false,
            image: null
        }, {
            id: 4,
            title: '👨‍👩‍👧‍👦 Bữa tối gia đình ấm áp',
            description: 'Không gì quý giá hơn những bữa cơm sum họp bên gia đình.',
            date: '2024-04-05',
            location: 'TP.HCM',
            category: 'family',
            emoji: '👨‍👩‍👧‍👦',
            liked: false,
            image: null
        }, {
            id: 5,
            title: '🌃 Sài Gòn về đêm',
            description: 'Thành phố nhộn nhịp với những ánh đèn lung linh trên đường phố.',
            date: '2024-05-12',
            location: 'TP.HCM',
            category: 'city',
            emoji: '🌃',
            liked: false,
            image: null
        }, {
            id: 6,
            title: '🏝️ Đảo Phú Quốc yên bình',
            description: 'Một góc thiên đường tại đảo Phú Quốc với bãi biển trong xanh.',
            date: '2024-06-18',
            location: 'Phú Quốc',
            category: 'travel',
            emoji: '🏝️',
            liked: false,
            image: null
        }];

        // ============================================================
        // 3. LOAD/SAVE
        // ============================================================
        function loadData() {
            const saved = localStorage.getItem('lifeJournal');
            if (saved) {
                try {
                    memories = JSON.parse(saved);
                } catch {
                    memories = sampleMemories;
                }
            } else {
                memories = sampleMemories;
            }
            renderMemories();
            updateStats();
        }

        function saveData() {
            localStorage.setItem('lifeJournal', JSON.stringify(memories));
            updateStats();
        }

        function updateStats() {
            document.getElementById('countDisplay').textContent = memories.length;
            document.getElementById('likedDisplay').textContent = memories.filter(m => m.liked).length;
            const categories = new Set(memories.map(m => m.category));
            document.getElementById('categoryDisplay').textContent = categories.size;
        }

        // ============================================================
        // 4. RENDER
        // ============================================================
        function renderMemories() {
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';

            let filtered = memories;
            if (currentFilter === 'favorite') {
                filtered = memories.filter(m => m.liked);
            } else if (currentFilter !== 'all') {
                filtered = memories.filter(m => m.category === currentFilter);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>Chưa có kỷ niệm nào</h3>
                    </div>
                `;
                return;
            }

            const emojis = ['📸', '✈️', '🌿', '👨‍👩‍👧‍👦', '🍜', '🌲', '🌃', '⭐'];

            filtered.forEach((memory, index) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.style.transitionDelay = `${(index % 6) * 0.08}s`;
                card.dataset.id = memory.id;

                const randomEmoji = memory.emoji || emojis[Math.floor(Math.random() * emojis.length)];

                card.innerHTML = `
                    <div class="image-wrapper">
                        ${memory.image ? `
                            <img src="${memory.image}" alt="${memory.title}" onload="this.style.opacity='1'">
                        ` : `
                            <div class="placeholder">
                                <div class="icon">${randomEmoji}</div>
                            </div>
                        `}
                        <div class="overlay">
                            <div class="actions">
                                <button onclick="toggleLike(${memory.id})" title="Yêu thích">
                                    <i class="fas ${memory.liked ? 'fa-heart' : 'fa-heart'}"></i>
                                </button>
                                <button onclick="deleteMemory(${memory.id})" title="Xóa">
                                    <i class="fas fa-trash"></i>
                                </button>
                                <button onclick="editMemory(${memory.id})" title="Sửa">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </div>
                        </div>
                        <span class="badge-date">${formatDate(memory.date)}</span>
                        ${memory.location ? `<span class="badge-location"><i class="fas fa-map-pin"></i> ${memory.location}</span>` : ''}
                    </div>
                    <div class="card-body">
                        <h3 class="title">${memory.title}</h3>
                        ${memory.description ? `<p class="desc">${memory.description}</p>` : ''}
                        <div class="tags">
                            <span>${getCategoryLabel(memory.category)}</span>
                        </div>
                        <div class="footer">
                            <span class="emoji">${randomEmoji}</span>
                            <div class="interact">
                                <button onclick="toggleLike(${memory.id})" class="${memory.liked ? 'liked' : ''}">
                                    <i class="fas ${memory.liked ? 'fa-heart' : 'fa-heart'}"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);

                requestAnimationFrame(() => {
                    card.classList.add('visible');
                });
            });
        }

        // ============================================================
        // 5. HELPERS
        // ============================================================
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const d = new Date(dateStr);
            return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function getCategoryLabel(cat) {
            const labels = {
                travel: '✈️ Du lịch',
                life: '🌿 Đời sống',
                family: '👨‍👩‍👧‍👦 Gia đình',
                food: '🍜 Ẩm thực',
                nature: '🌲 Thiên nhiên',
                city: '🌃 Thành phố'
            };
            return labels[cat] || '📸 Khác';
        }

        // ============================================================
        // 6. CRUD
        // ============================================================
        function addMemory(memory) {
            memory.id = Date.now();
            memory.liked = false;
            memories.unshift(memory);
            saveData();
            renderMemories();
            showToast('✨ Đã thêm kỷ niệm mới!');
        }

        function deleteMemory(id) {
            if (confirm('Xóa kỷ niệm này?')) {
                memories = memories.filter(m => m.id !== id);
                saveData();
                renderMemories();
                showToast('🗑️ Đã xóa kỷ niệm');
            }
        }

        function toggleLike(id) {
            const memory = memories.find(m => m.id === id);
            if (memory) {
                memory.liked = !memory.liked;
                saveData();
                renderMemories();
                showToast(memory.liked ? '❤️ Đã thích!' : '💔 Bỏ thích');
            }
        }

        function editMemory(id) {
            const memory = memories.find(m => m.id === id);
            if (!memory) return;
            editingId = id;
            document.getElementById('titleInput').value = memory.title || '';
            document.getElementById('descInput').value = memory.description || '';
            document.getElementById('dateInput').value = memory.date || '';
            document.getElementById('locationInput').value = memory.location || '';
            document.getElementById('categoryInput').value = memory.category || 'travel';
            document.querySelector('.modal-box h2').textContent = '✏️ Sửa kỷ niệm';
            document.querySelector('.modal-box .submit').innerHTML = '<i class="fas fa-save"></i> Cập nhật';
            openModal();
        }

        // ============================================================
        // 7. MODAL
        // ============================================================
        function openModal() {
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
            if (!editingId) {
                document.getElementById('memoryForm').reset();
                document.querySelector('.modal-box h2').textContent = '✨ Kỷ niệm mới';
                document.querySelector('.modal-box .submit').innerHTML = '<i class="fas fa-save"></i> Lưu';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = '';
            editingId = null;
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ============================================================
        // 8. FORM
        // ============================================================
        document.getElementById('memoryForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                showToast('⚠️ Vui lòng nhập tiêu đề!');
                return;
            }

            const fileInput = document.getElementById('imageInput');
            let imageData = null;

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imageData = event.target.result;
                    saveMemory(title, imageData);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveMemory(title, null);
            }
        });

        function saveMemory(title, imageData) {
            const memory = {
                title: title,
                description: document.getElementById('descInput').value.trim(),
                date: document.getElementById('dateInput').value || new Date().toISOString().split('T')[0],
                location: document.getElementById('locationInput').value.trim(),
                category: document.getElementById('categoryInput').value,
                image: imageData,
                emoji: null
            };

            if (editingId) {
                const index = memories.findIndex(m => m.id === editingId);
                if (index !== -1) {
                    memories[index] = { ...memories[index], ...memory };
                    saveData();
                    renderMemories();
                    showToast('✅ Đã cập nhật!');
                }
                editingId = null;
            } else {
                addMemory(memory);
            }

            closeModal();
            document.getElementById('memoryForm').reset();
        }

        // ============================================================
        // 9. FILTERS
        // ============================================================
        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderMemories();
                showToast(`📂 ${this.textContent.trim()}`);
            });
        });

        // ============================================================
        // 10. EXPORT/IMPORT
        // ============================================================
        function exportData() {
            const data = JSON.stringify(memories, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `life-journal-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 Đã xuất dữ liệu!');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (Array.isArray(data)) {
                            if (confirm(`Nhập ${data.length} kỷ niệm?`)) {
                                memories = data;
                                saveData();
                                renderMemories();
                                showToast(`📥 Đã nhập ${data.length} kỷ niệm!`);
                            }
                        }
                    } catch {
                        showToast('⚠️ File không hợp lệ!');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ============================================================
        // 11. TOAST
        // ============================================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // 12. KEYBOARD
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if ((e.key === 'n' || e.key === 'N') && !document.getElementById('modal').classList.contains('active')) {
                openModal();
            }
        });

        // ============================================================
        // 13. INIT
        // ============================================================
        loadData();
        console.log('✨ Life Journal - Premium Animation loaded!');
        console.log(`📸 ${memories.length} kỷ niệm`);
        console.log('⌨️ N: Thêm mới | ESC: Đóng modal');
        console.log('🔥 Animation siêu cấp đã được nâng cấp!');
    </script>

</body>
</html>
