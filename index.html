<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ SPACE SHOOTER - Game Vũ Trụ Xịn Xò</title>
    <style>
        /* ===== RESET & FULLSCREEN ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        /* ===== BACKGROUND STARS ===== */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0d0d2b 0%, #050510 100%);
        }

        /* ===== MAIN GAME ===== */
        #game-wrapper {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            background: rgba(0, 0, 30, 0.7);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 80px rgba(100, 50, 255, 0.2),
                        0 0 160px rgba(100, 50, 255, 0.1),
                        inset 0 0 80px rgba(100, 50, 255, 0.05);
            cursor: none;
        }

        /* ===== GLOW BORDER ANIMATION ===== */
        #game-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 22px;
            background: conic-gradient(from 0deg, 
                #ff6b6b, #f7971e, #ffd200, #a29bfe, 
                #6c5ce7, #fd79a8, #ff6b6b);
            z-index: -1;
            animation: rotateBorder 4s linear infinite;
            opacity: 0.5;
        }

        @keyframes rotateBorder {
            to { transform: rotate(360deg); }
        }

        /* ===== PLAYER ===== */
        #player {
            position: absolute;
            width: 50px;
            height: 50px;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            filter: drop-shadow(0 0 20px rgba(100, 200, 255, 0.6));
            transition: filter 0.3s;
        }

        #player svg {
            width: 100%;
            height: 100%;
            animation: floatShip 2s ease-in-out infinite;
        }

        @keyframes floatShip {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        #player .engine {
            animation: engineFire 0.3s ease-in-out infinite alternate;
        }

        @keyframes engineFire {
            0% { opacity: 0.6; transform: scaleY(0.8); }
            100% { opacity: 1; transform: scaleY(1.2); }
        }

        /* ===== BULLETS ===== */
        .bullet {
            position: absolute;
            width: 4px;
            height: 16px;
            background: linear-gradient(to top, #00d2ff, #3a7bd5);
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            z-index: 5;
            animation: bulletTrail 0.2s ease-out;
        }

        @keyframes bulletTrail {
            0% { transform: scaleY(0.3); opacity: 0.8; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* ===== ENEMIES ===== */
        .enemy {
            position: absolute;
            z-index: 5;
            animation: enemyAppear 0.5s ease-out;
            filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.4));
        }

        @keyframes enemyAppear {
            0% { transform: scale(0) rotate(180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .enemy svg {
            width: 100%;
            height: 100%;
            animation: enemyFloat 1.5s ease-in-out infinite;
        }

        @keyframes enemyFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(5deg); }
        }

        /* ===== EXPLOSION ===== */
        .explosion {
            position: absolute;
            z-index: 20;
            pointer-events: none;
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(0.2); opacity: 1; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* ===== SCORE ===== */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 15;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            font-size: 18px;
            pointer-events: none;
        }

        #score {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            font-size: 22px;
            letter-spacing: 2px;
            animation: scorePulse 2s ease-in-out infinite;
        }

        #score span {
            color: #ffd700;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        #lives {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 100, 100, 0.2);
            font-size: 22px;
        }

        .life-heart {
            color: #ff4757;
            display: inline-block;
            animation: heartBeat 0.8s ease-in-out infinite;
            margin: 0 2px;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* ===== GAME OVER ===== */
        #game-over {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 30;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.5s ease-out;
        }

        #game-over.show {
            display: flex;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        #game-over h1 {
            font-size: 72px;
            color: #ff4757;
            text-shadow: 0 0 40px rgba(255, 71, 87, 0.5),
                         0 0 80px rgba(255, 71, 87, 0.3);
            animation: glitchText 2s infinite;
            margin-bottom: 10px;
        }

        @keyframes glitchText {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-5px, 3px); }
            40% { transform: translate(5px, -3px); }
            60% { transform: translate(-3px, 5px); }
            80% { transform: translate(3px, -5px); }
        }

        #game-over .final-score {
            font-size: 28px;
            color: #ffd700;
            margin: 10px 0 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        #game-over .final-score span {
            font-size: 48px;
            font-weight: 900;
        }

        #restart-btn {
            padding: 16px 50px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a1a;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 40px rgba(247, 151, 30, 0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #restart-btn:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 0 60px rgba(247, 151, 30, 0.5);
        }

        #restart-btn:active {
            transform: scale(0.95);
        }

        /* ===== COMBO ===== */
        #combo {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            color: #ffd700;
            font-size: 28px;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        #combo.show {
            opacity: 1;
            animation: comboPop 0.5s ease-out;
        }

        @keyframes comboPop {
            0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
            50% { transform: translateX(-50%) scale(1.3); opacity: 1; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        /* ===== POWERUP ===== */
        .powerup {
            position: absolute;
            z-index: 5;
            font-size: 30px;
            animation: powerupFloat 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0, 255, 200, 0.6));
            cursor: pointer;
        }

        @keyframes powerupFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(180deg); }
        }

        /* ===== SHOOTING COOLDOWN ===== */
        #cooldown-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        #cooldown-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-radius: 2px;
            transition: width 0.05s linear;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 850px) {
            #game-container {
                width: 96vw;
                height: 70vh;
                border-radius: 12px;
            }
            #game-container::before {
                border-radius: 14px;
            }
            #ui {
                font-size: 14px;
                top: 10px;
                left: 10px;
                right: 10px;
            }
            #score, #lives {
                padding: 6px 14px;
                font-size: 16px;
            }
            #game-over h1 {
                font-size: 42px;
            }
            #game-over .final-score {
                font-size: 20px;
            }
            #game-over .final-score span {
                font-size: 32px;
            }
            #restart-btn {
                padding: 12px 32px;
                font-size: 16px;
            }
        }

        @media (max-width: 500px) {
            #game-container {
                height: 60vh;
            }
            #ui {
                font-size: 12px;
            }
            #score, #lives {
                padding: 4px 10px;
                font-size: 13px;
            }
            #player {
                width: 35px;
                height: 35px;
            }
            .enemy {
                width: 35px !important;
                height: 35px !important;
            }
            #game-over h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== STARS BACKGROUND ===== -->
    <canvas id="stars-canvas"></canvas>

    <!-- ===== GAME ===== -->
    <div id="game-wrapper">
        <div id="game-container">

            <!-- UI -->
            <div id="ui">
                <div id="score">⭐ <span id="score-value">0</span></div>
                <div id="lives">
                    <span id="lives-value">❤️❤️❤️</span>
                </div>
            </div>

            <div id="combo">🔥 COMBO x<span id="combo-value">0</span></div>

            <!-- Player -->
            <div id="player">
                <svg viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <polygon points="50,10 15,85 50,65 85,85" fill="url(#shipGrad)" filter="url(#glow)"/>
                    <polygon points="50,25 35,70 50,55 65,70" fill="#fff" opacity="0.3"/>
                    <ellipse cx="50" cy="85" rx="15" ry="8" fill="#ff6b35" opacity="0.8" class="engine">
                        <animate attributeName="ry" values="6;10;6" dur="0.2s" repeatCount="indefinite"/>
                    </ellipse>
                </svg>
            </div>

            <!-- Cooldown -->
            <div id="cooldown-indicator">
                <div id="cooldown-bar"></div>
            </div>

            <!-- Game Over -->
            <div id="game-over">
                <h1>💀 GAME OVER</h1>
                <div class="final-score">⭐ SCORE: <span id="final-score">0</span></div>
                <button id="restart-btn">🔄 Chơi lại</button>
            </div>

        </div>
    </div>

    <script>
        // ================================================
        // 1. STARS BACKGROUND
        // ================================================
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function initStars() {
            stars = [];
            for (let i = 0; i < 300; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2,
                    speed: Math.random() * 0.5 + 0.1,
                    opacity: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.01
                });
            }
        }
        initStars();

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Nebula effect
            const grd = ctx.createRadialGradient(
                canvas.width * 0.3, canvas.height * 0.4, 0,
                canvas.width * 0.3, canvas.height * 0.4, canvas.width * 0.8
            );
            grd.addColorStop(0, 'rgba(100, 50, 255, 0.05)');
            grd.addColorStop(0.5, 'rgba(255, 50, 150, 0.03)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.y += star.speed;
                star.opacity += (Math.random() - 0.5) * star.twinkleSpeed;
                star.opacity = Math.max(0.2, Math.min(1, star.opacity));

                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity * 0.8})`;
                ctx.fill();

                // Glow
                if (star.radius > 1.2) {
                    ctx.shadowColor = 'rgba(150, 200, 255, 0.3)';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            requestAnimationFrame(drawStars);
        }
        drawStars();

        // ================================================
        // 2. GAME ENGINE
        // ================================================
        const container = document.getElementById('game-container');
        const player = document.getElementById('player');
        const scoreElement = document.getElementById('score-value');
        const livesElement = document.getElementById('lives-value');
        const finalScoreElement = document.getElementById('final-score');
        const gameOverElement = document.getElementById('game-over');
        const restartBtn = document.getElementById('restart-btn');
        const comboElement = document.getElementById('combo');
        const comboValue = document.getElementById('combo-value');
        const cooldownBar = document.getElementById('cooldown-bar');

        // Game state
        let game = {
            score: 0,
            lives: 3,
            combo: 0,
            maxCombo: 0,
            isRunning: true,
            isGameOver: false,
            shootCooldown: 0,
            maxShootCooldown: 12,
            enemies: [],
            bullets: [],
            powerups: [],
            explosions: [],
            enemySpawnTimer: 0,
            powerupSpawnTimer: 0,
            mouseX: 0,
            mouseY: 0
        };

        // Player position
        let playerX = container.clientWidth / 2 - 25;
        let playerY = container.clientHeight - 100;

        // ================================================
        // 3. SPAWN FUNCTIONS
        // ================================================
        function spawnEnemy() {
            if (!game.isRunning) return;

            const size = Math.random() * 25 + 25;
            const x = Math.random() * (container.clientWidth - size);
            const y = -size;

            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.style.width = size + 'px';
            enemy.style.height = size + 'px';
            enemy.style.left = x + 'px';
            enemy.style.top = y + 'px';

            // Random enemy type
            const types = [
                `<svg viewBox="0 0 100 100">
                    <polygon points="50,10 90,90 10,90" fill="#ff4757" stroke="#ff6b81" stroke-width="2"/>
                    <circle cx="35" cy="60" r="8" fill="#fff" opacity="0.6"/>
                    <circle cx="65" cy="60" r="8" fill="#fff" opacity="0.6"/>
                    <circle cx="50" cy="80" r="5" fill="#ff6b81"/>
                </svg>`,
                `<svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" fill="#2ed573" stroke="#7bed9f" stroke-width="2"/>
                    <circle cx="35" cy="45" r="6" fill="#fff" opacity="0.6"/>
                    <circle cx="65" cy="45" r="6" fill="#fff" opacity="0.6"/>
                    <rect x="40" y="60" width="20" height="10" rx="5" fill="#ff6b81"/>
                </svg>`,
                `<svg viewBox="0 0 100 100">
                    <rect x="20" y="20" width="60" height="60" rx="10" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2"/>
                    <circle cx="35" cy="40" r="5" fill="#fff" opacity="0.6"/>
                    <circle cx="65" cy="40" r="5" fill="#fff" opacity="0.6"/>
                    <rect x="40" y="55" width="20" height="6" rx="3" fill="#ff6b81"/>
                </svg>`
            ];

            enemy.innerHTML = types[Math.floor(Math.random() * types.length)];
            container.appendChild(enemy);

            const speed = Math.random() * 2 + 1.5;

            game.enemies.push({
                element: enemy,
                x: x,
                y: y,
                width: size,
                height: size,
                speed: speed,
                hp: Math.random() > 0.7 ? 2 : 1,
                type: Math.floor(Math.random() * 3)
            });
        }

        function spawnPowerup(x, y) {
            const types = ['⚡', '💎', '⭐'];
            const type = types[Math.floor(Math.random() * types.length)];

            const el = document.createElement('div');
            el.className = 'powerup';
            el.textContent = type;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.fontSize = (Math.random() * 10 + 25) + 'px';
            container.appendChild(el);

            game.powerups.push({
                element: el,
                x: x,
                y: y,
                type: type,
                speed: 1.5
            });
        }

        // ================================================
        // 4. SHOOTING
        // ================================================
        function shoot() {
            if (!game.isRunning || game.shootCooldown > 0) return;

            game.shootCooldown = game.maxShootCooldown;

            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            const bx = playerX + 25 - 2;
            const by = playerY - 10;
            bullet.style.left = bx + 'px';
            bullet.style.top = by + 'px';
            container.appendChild(bullet);

            game.bullets.push({
                element: bullet,
                x: bx,
                y: by,
                speed: 8
            });

            // Shooting sound effect (visual)
            player.style.filter = 'drop-shadow(0 0 40px rgba(100, 200, 255, 0.9))';
            setTimeout(() => {
                player.style.filter = 'drop-shadow(0 0 20px rgba(100, 200, 255, 0.6))';
            }, 100);
        }

        // ================================================
        // 5. EXPLOSION
        // ================================================
        function createExplosion(x, y, color = '#ffd700') {
            const el = document.createElement('div');
            el.className = 'explosion';
            el.style.left = (x - 30) + 'px';
            el.style.top = (y - 30) + 'px';
            el.style.width = '60px';
            el.style.height = '60px';
            el.innerHTML = `
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="30" fill="${color}" opacity="0.8"/>
                    <circle cx="50" cy="50" r="20" fill="#fff" opacity="0.6"/>
                    ${Array.from({length: 12}, (_, i) => `
                        <line x1="50" y1="50" x2="${50 + 40 * Math.cos(i * Math.PI / 6)}" 
                              y2="${50 + 40 * Math.sin(i * Math.PI / 6)}" 
                              stroke="${color}" stroke-width="3" opacity="0.5"/>
                    `).join('')}
                </svg>
            `;
            container.appendChild(el);

            game.explosions.push({ element: el, timer: 0 });

            // Screen shake effect
            container.style.transform = 'translate(5px, -5px)';
            setTimeout(() => {
                container.style.transform = 'translate(-3px, 3px)';
                setTimeout(() => {
                    container.style.transform = 'translate(0px, 0px)';
                }, 50);
            }, 50);
        }

        // ================================================
        // 6. GAME LOOP
        // ================================================
        function update() {
            if (!game.isRunning) return;

            // Cooldown
            if (game.shootCooldown > 0) {
                game.shootCooldown--;
                cooldownBar.style.width = (game.shootCooldown / game.maxShootCooldown * 100) + '%';
            } else {
                cooldownBar.style.width = '100%';
            }

            // Update player position (follow mouse)
            const rect = container.getBoundingClientRect();
            const mouseX = game.mouseX - rect.left - 25;
            const mouseY = game.mouseY - rect.top - 25;

            playerX = Math.max(0, Math.min(container.clientWidth - 50, mouseX));
            playerY = Math.max(0, Math.min(container.clientHeight - 50, mouseY));
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';

            // Auto-shoot
            if (game.shootCooldown === 0) {
                shoot();
            }

            // Spawn enemies
            game.enemySpawnTimer++;
            const spawnRate = Math.max(15, 60 - Math.floor(game.score / 100) * 2);
            if (game.enemySpawnTimer >= spawnRate) {
                game.enemySpawnTimer = 0;
                const count = Math.min(3, 1 + Math.floor(game.score / 200));
                for (let i = 0; i < count; i++) {
                    setTimeout(() => spawnEnemy(), i * 100);
                }
            }

            // Spawn powerups
            game.powerupSpawnTimer++;
            if (game.powerupSpawnTimer >= 400) {
                game.powerupSpawnTimer = 0;
                const x = Math.random() * (container.clientWidth - 40);
                spawnPowerup(x, -40);
            }

            // Update enemies
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const enemy = game.enemies[i];
                enemy.y += enemy.speed;
                enemy.element.style.top = enemy.y + 'px';

                // Enemy out of screen
                if (enemy.y > container.clientHeight + 50) {
                    enemy.element.remove();
                    game.enemies.splice(i, 1);
                    continue;
                }

                // Enemy collision with player
                const playerCenterX = playerX + 25;
                const playerCenterY = playerY + 25;
                const enemyCenterX = enemy.x + enemy.width / 2;
                const enemyCenterY = enemy.y + enemy.height / 2;
                const dist = Math.hypot(playerCenterX - enemyCenterX, playerCenterY - enemyCenterY);

                if (dist < 35) {
                    // Player hit
                    createExplosion(enemyCenterX, enemyCenterY, '#ff4757');
                    enemy.element.remove();
                    game.enemies.splice(i, 1);
                    game.lives--;
                    game.combo = 0;
                    updateUI();

                    if (game.lives <= 0) {
                        gameOver();
                        return;
                    }
                    continue;
                }

                // Enemy collision with bullets
                for (let j = game.bullets.length - 1; j >= 0; j--) {
                    const bullet = game.bullets[j];
                    const bulletCenterX = bullet.x + 2;
                    const bulletCenterY = bullet.y + 8;

                    if (Math.abs(bulletCenterX - enemyCenterX) < enemy.width / 2 + 4 &&
                        Math.abs(bulletCenterY - enemyCenterY) < enemy.height / 2 + 8) {
                        // Hit!
                        bullet.element.remove();
                        game.bullets.splice(j, 1);

                        enemy.hp--;
                        if (enemy.hp <= 0) {
                            createExplosion(enemyCenterX, enemyCenterY, '#ffd700');
                            enemy.element.remove();
                            game.enemies.splice(i, 1);

                            // Score + combo
                            game.score += 10 + game.combo * 2;
                            game.combo++;
                            if (game.combo > game.maxCombo) game.maxCombo = game.combo;

                            // Combo display
                            if (game.combo >= 3) {
                                comboValue.textContent = game.combo;
                                comboElement.classList.add('show');
                                clearTimeout(comboElement._hideTimer);
                                comboElement._hideTimer = setTimeout(() => {
                                    comboElement.classList.remove('show');
                                }, 1500);
                            }

                            // Bonus powerup
                            if (Math.random() > 0.85) {
                                spawnPowerup(enemy.x, enemy.y);
                            }

                            updateUI();
                        } else {
                            // Enemy flashes when hit
                            enemy.element.style.opacity = '0.3';
                            setTimeout(() => {
                                enemy.element.style.opacity = '1';
                            }, 100);
                        }
                        break;
                    }
                }
            }

            // Update bullets
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bullet = game.bullets[i];
                bullet.y -= bullet.speed;
                bullet.element.style.top = bullet.y + 'px';

                if (bullet.y < -20) {
                    bullet.element.remove();
                    game.bullets.splice(i, 1);
                }
            }

            // Update powerups
            for (let i = game.powerups.length - 1; i >= 0; i--) {
                const p = game.powerups[i];
                p.y += p.speed;
                p.element.style.top = p.y + 'px';

                if (p.y > container.clientHeight + 50) {
                    p.element.remove();
                    game.powerups.splice(i, 1);
                    continue;
                }

                // Powerup collision with player
                const pCenterX = p.x + 20;
                const pCenterY = p.y + 20;
                const distP = Math.hypot(playerCenterX - pCenterX, playerCenterY - pCenterY);

                if (distP < 40) {
                    p.element.remove();
                    game.powerups.splice(i, 1);

                    // Powerup effects
                    if (p.type === '⚡') {
                        game.score += 50;
                        createExplosion(pCenterX, pCenterY, '#00d2ff');
                    } else if (p.type === '💎') {
                        game.score += 100;
                        createExplosion(pCenterX, pCenterY, '#ff6b6b');
                    } else if (p.type === '⭐') {
                        game.lives = Math.min(5, game.lives + 1);
                        createExplosion(pCenterX, pCenterY, '#ffd700');
                    }
                    updateUI();
                }
            }

            // Remove expired explosions
            for (let i = game.explosions.length - 1; i >= 0; i--) {
                game.explosions[i].timer++;
                if (game.explosions[i].timer > 20) {
                    game.explosions[i].element.remove();
                    game.explosions.splice(i, 1);
                }
            }

            requestAnimationFrame(update);
        }

        // ================================================
        // 7. UI UPDATE
        // ================================================
        function updateUI() {
            scoreElement.textContent = game.score;
            livesElement.textContent = '❤️'.repeat(Math.max(0, game.lives));
        }

        // ================================================
        // 8. GAME OVER
        // ================================================
        function gameOver() {
            game.isRunning = false;
            game.isGameOver = true;
            finalScoreElement.textContent = game.score;
            gameOverElement.classList.add('show');

            // Big explosion
            createExplosion(container.clientWidth / 2, container.clientHeight / 2, '#ff4757');
            setTimeout(() => {
                createExplosion(container.clientWidth / 2 - 100, container.clientHeight / 2 - 50, '#ffd700');
            }, 200);
            setTimeout(() => {
                createExplosion(container.clientWidth / 2 + 100, container.clientHeight / 2 + 50, '#ff6b6b');
            }, 400);
        }

        // ================================================
        // 9. RESTART
        // ================================================
        function restartGame() {
            // Remove all entities
            document.querySelectorAll('.enemy, .bullet, .powerup, .explosion').forEach(el => el.remove());

            game.score = 0;
            game.lives = 3;
            game.combo = 0;
            game.maxCombo = 0;
            game.isRunning = true;
            game.isGameOver = false;
            game.enemies = [];
            game.bullets = [];
            game.powerups = [];
            game.explosions = [];
            game.enemySpawnTimer = 0;
            game.powerupSpawnTimer = 0;
            game.shootCooldown = 0;

            gameOverElement.classList.remove('show');
            comboElement.classList.remove('show');
            updateUI();
            cooldownBar.style.width = '100%';

            playerX = container.clientWidth / 2 - 25;
            playerY = container.clientHeight - 100;
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';

            // Start game loop again
            if (game.loopId) cancelAnimationFrame(game.loopId);
            game.loopId = requestAnimationFrame(update);
        }

        // ================================================
        // 10. EVENT LISTENERS
        // ================================================
        // Mouse movement
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            game.mouseX = e.clientX;
            game.mouseY = e.clientY;
        });

        container.addEventListener('mouseleave', () => {
            // Center player when mouse leaves
            game.mouseX = container.getBoundingClientRect().left + container.clientWidth / 2;
            game.mouseY = container.getBoundingClientRect().top + container.clientHeight - 50;
        });

        // Click to shoot (manual)
        container.addEventListener('click', () => {
            if (game.isRunning && game.shootCooldown === 0) {
                shoot();
            }
        });

        // Restart
        restartBtn.addEventListener('click', restartGame);

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (game.isRunning && game.shootCooldown === 0) {
                    shoot();
                }
                if (game.isGameOver) {
                    restartGame();
                }
            }
            if (e.key === 'r' || e.key === 'R') {
                if (game.isGameOver) restartGame();
            }
        });

        // Prevent context menu
        container.addEventListener('contextmenu', (e) => e.preventDefault());

        // ================================================
        // 11. START GAME
        // ================================================
        // Initial setup
        playerX = container.clientWidth / 2 - 25;
        playerY = container.clientHeight - 100;
        player.style.left = playerX + 'px';
        player.style.top = playerY + 'px';
        updateUI();

        // Start game loop
        game.loopId = requestAnimationFrame(update);

        // Spawn initial enemies
        setTimeout(() => spawnEnemy(), 500);
        setTimeout(() => spawnEnemy(), 1000);
        setTimeout(() => spawnEnemy(), 1500);

        // ================================================
        // 12. RESIZE HANDLER
        // ================================================
        window.addEventListener('resize', () => {
            // Keep player in bounds
            const maxX = container.clientWidth - 50;
            const maxY = container.clientHeight - 50;
            playerX = Math.max(0, Math.min(maxX, playerX));
            playerY = Math.max(0, Math.min(maxY, playerY));
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
        });

        console.log('🚀 SPACE SHOOTER loaded!');
        console.log('🎯 Click/space to shoot');
        console.log('⌨️ Press R to restart');
    </script>

</body>
</html>
