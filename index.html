<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Vibe Photo Gallery</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-pink: #ff0050;
            --accent-cyan: #00f2fe;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 80, 0.3);
            margin-bottom: 10px;
        }

        /* Controls Area */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .upload-btn, .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .upload-btn:hover, .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan));
            border-color: transparent;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        #file-input {
            display: none;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            perspective: 1000px;
        }

        /* Photo Card & TikTok Effects */
        .card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transform-style: preserve-3d;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            cursor: pointer;
            aspect-ratio: 4 / 5;
        }

        .card:hover {
            transform: translateY(-10px) rotateX(5deg) rotateY(-5deg);
            box-shadow: -5px 10px 25px rgba(0, 242, 254, 0.3), 
                        5px -10px 25px rgba(255, 0, 80, 0.3);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        /* Shimmer Flash Effect */
        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 30%,
                rgba(255, 255, 255, 0.25) 50%,
                transparent 70%
            );
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.8s ease;
        }

        .card:hover::after {
            transform: rotate(30deg) translateY(100%);
        }

        /* Edit Styles (Filters) */
        .filter-cyberpunk img { filter: contrast(120%) saturate(150%) hue-rotate(190deg); }
        .filter-vintage img { filter: sepia(40%) contrast(110%) brightness(90%); }
        .filter-dramatic img { filter: contrast(160%) grayscale(30%); }

        /* Fullscreen Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
        }

        .modal.active {
            display: flex;
        }

        .modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>TIKTOK EDIT GALLERY</h1>
        <p>Lưu giữ khoảnh khắc với hiệu ứng đỉnh cao</p>
    </header>

    <div class="controls">
        <label for="file-input" class="upload-btn">+ Thêm ảnh mới</label>
        <input type="file" id="file-input" accept="image/*" multiple>
        
        <button class="filter-btn active" onclick="applyGlobalFilter('normal')">Gốc</button>
        <button class="filter-btn" onclick="applyGlobalFilter('cyberpunk')">Cyberpunk</button>
        <button class="filter-btn" onclick="applyGlobalFilter('vintage')">Vintage</button>
        <button class="filter-btn" onclick="applyGlobalFilter('dramatic')">Dramatic</button>
    </div>

    <main class="gallery" id="gallery"></main>

    <div class="modal" id="modal" onclick="closeModal()">
        <img id="modal-img" src="" alt="Preview">
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const fileInput = document.getElementById('file-input');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');

        // Mẫu ảnh ban đầu
        const sampleImages = [
            'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600',
            'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600',
            'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600'
        ];

        function createCard(src) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${src}" alt="Photo">`;
            
            card.addEventListener('click', () => {
                modalImg.src = src;
                modal.classList.add('active');
            });

            return card;
        }

        // Tải ảnh mặc định
        sampleImages.forEach(src => gallery.appendChild(createCard(src)));

        // Tải ảnh từ máy
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    gallery.prepend(createCard(event.target.result));
                };
                reader.readAsDataURL(file);
            });
        });

        // Áp dụng bộ lọc màu Style TikTok
        function applyGlobalFilter(filterName) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.classList.remove('filter-cyberpunk', 'filter-vintage', 'filter-dramatic');
                if (filterName !== 'normal') {
                    card.classList.add(`filter-${filterName}`);
                }
            });
        }

        function closeModal() {
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
