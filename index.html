<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ WeatherHub - Đồng hồ + Thời tiết + Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95), rgba(30, 20, 80, 0.9));
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .logo span {
            font-size: 28px;
            -webkit-text-fill-color: initial;
        }

        .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s;
        }

        .search-box:focus-within {
            border-color: rgba(0, 210, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.1);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 8px 5px;
            min-width: 200px;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-box button {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .search-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-actions button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        /* ===== MAIN GRID ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            min-height: calc(100vh - 100px);
        }

        /* ===== LEFT PANEL ===== */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== CLOCK CARD ===== */
        .clock-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .clock-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 210, 255, 0.03), transparent, rgba(58, 123, 213, 0.03), transparent);
            animation: rotateBg 20s linear infinite;
        }

        @keyframes rotateBg {
            to { transform: rotate(360deg); }
        }

        .clock-card > * {
            position: relative;
            z-index: 1;
        }

        .clock-time {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variant-numeric: tabular-nums;
            letter-spacing: 3px;
            line-height: 1;
            text-shadow: 0 0 60px rgba(0, 210, 255, 0.2);
        }

        .clock-date {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .clock-seconds {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 5px;
            font-weight: 300;
        }

        .clock-greeting {
            font-size: 20px;
            margin-top: 15px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ===== WEATHER CARD ===== */
        .weather-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border-radius: 24px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            flex: 1;
        }

        .weather-card h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 15px;
            font-weight: 400;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .weather-icon {
            font-size: 64px;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .weather-temp {
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #f7971e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .weather-desc {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .weather-detail-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .weather-detail-item .label {
            font-size: 11px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        .weather-detail-item .value {
            font-size: 18px;
            font-weight: 600;
            margin-top: 3px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* ===== FORECAST ===== */
        .forecast-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .forecast-card h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 10px;
        }

        .forecast-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .forecast-list::-webkit-scrollbar {
            height: 3px;
        }

        .forecast-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .forecast-list::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-radius: 10px;
        }

        .forecast-item {
            min-width: 80px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .forecast-item .day {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .forecast-item .icon {
            font-size: 28px;
            margin: 5px 0;
        }

        .forecast-item .temp {
            font-size: 16px;
            font-weight: 600;
        }

        .forecast-item .temp-high {
            color: #ff6b6b;
        }

        .forecast-item .temp-low {
            color: #74b9ff;
            font-size: 13px;
        }

        /* ===== MAP ===== */
        .map-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            min-height: 500px;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 500px;
            background: #0a0e27;
        }

        .map-overlay-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .map-overlay-controls button {
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-overlay-controls button:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: rgba(0, 210, 255, 0.3);
            transform: scale(1.05);
        }

        .map-overlay-controls button.active {
            background: rgba(0, 210, 255, 0.2);
            border-color: #00d2ff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
        }

        .map-legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .map-legend .gradient {
            display: flex;
            gap: 2px;
            margin-top: 5px;
            height: 8px;
            width: 150px;
            border-radius: 4px;
            background: linear-gradient(90deg, #74b9ff, #00d2ff, #fdcb6e, #ff6b6b, #e84393);
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.4);
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .left-panel {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .clock-card {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 15px;
            }

            .search-box input {
                min-width: 120px;
                font-size: 13px;
            }

            .left-panel {
                grid-template-columns: 1fr;
            }

            .clock-time {
                font-size: 48px;
            }

            .weather-temp {
                font-size: 38px;
            }

            .weather-main {
                flex-direction: column;
                text-align: center;
            }

            .weather-details {
                grid-template-columns: 1fr 1fr;
            }

            #map, .map-container {
                min-height: 350px;
            }
        }

        @media (max-width: 480px) {
            .clock-time {
                font-size: 36px;
            }

            .header-actions button {
                padding: 6px 12px;
                font-size: 12px;
            }

            .search-box {
                padding: 6px 12px;
            }

            .search-box input {
                min-width: 80px;
                font-size: 12px;
            }

            .search-box button {
                padding: 6px 14px;
                font-size: 12px;
            }
        }

        /* ===== CUSTOM SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo">
            <span>🌤️</span> WeatherHub
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Tìm thành phố..." value="Hanoi">
            <button id="searchBtn">Tìm</button>
        </div>
        <div class="header-actions">
            <button onclick="getCurrentLocation()">📍 Vị trí của tôi</button>
            <button onclick="toggleMapLayer()">🗺️ Lớp bản đồ</button>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="main-grid">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <!-- Clock -->
            <div class="clock-card">
                <div class="clock-time" id="clockTime">--:--:--</div>
                <div class="clock-date" id="clockDate">--</div>
                <div class="clock-seconds" id="clockSeconds">--</div>
                <div class="clock-greeting" id="clockGreeting">✨ Chào buổi...</div>
            </div>

            <!-- Weather -->
            <div class="weather-card" id="weatherCard">
                <h3>🌡️ Thời tiết hiện tại</h3>
                <div id="weatherContent">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải dữ liệu...</p>
                    </div>
                </div>

                <!-- Forecast -->
                <div class="forecast-card">
                    <h4>📅 Dự báo 5 ngày</h4>
                    <div class="forecast-list" id="forecastList">
                        <div class="loading" style="padding:10px;font-size:12px;">
                            Đang tải...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAP -->
        <div class="map-container">
            <div id="map"></div>

            <!-- Map Controls -->
            <div class="map-overlay-controls">
                <button onclick="zoomIn()" title="Phóng to">➕</button>
                <button onclick="zoomOut()" title="Thu nhỏ">➖</button>
                <button onclick="resetMapView()" title="Về vị trí ban đầu">🏠</button>
                <button id="toggleWindLayer" class="active" onclick="toggleWindLayer()" title="Hiển thị gió">💨</button>
                <button id="toggleTempLayer" onclick="toggleTempLayer()" title="Hiển thị nhiệt độ">🌡️</button>
            </div>

            <!-- Legend -->
            <div class="map-legend">
                <span>🌡️ Nhiệt độ</span>
                <div class="gradient"></div>
                <span style="font-size:10px;display:flex;justify-content:space-between;margin-top:3px;">
                    <span>10°C</span>
                    <span>30°C</span>
                    <span>40°C+</span>
                </span>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============================================================
        // 1. CLOCK
        // ============================================================
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('clockTime').textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById('clockSeconds').textContent = `⏱️ ${seconds}s`;

            // Date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('clockDate').textContent = now.toLocaleDateString('vi-VN', options);

            // Greeting
            const hour = now.getHours();
            let greeting = '🌙 Chúc bạn ngủ ngon!';
            if (hour >= 5 && hour < 12) greeting = '🌅 Chào buổi sáng!';
            else if (hour >= 12 && hour < 18) greeting = '☀️ Chào buổi chiều!';
            else if (hour >= 18 && hour < 22) greeting = '🌇 Chào buổi tối!';
            document.getElementById('clockGreeting').textContent = greeting;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // ============================================================
        // 2. MAP (Leaflet)
        // ============================================================
        let map;
        let currentCity = 'Hanoi';
        let windLayer = null;
        let tempLayer = null;
        let showWind = true;
        let showTemp = false;
        let mapMarkers = [];

        function initMap(lat = 21.0285, lng = 105.8542) {
            if (map) {
                map.setView([lat, lng], 8);
                return;
            }

            map = L.map('map', {
                center: [lat, lng],
                zoom: 8,
                zoomControl: false,
                attributionControl: true
            });

            // Base tile layer (dark style like Windy)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 19,
                minZoom: 3
            }).addTo(map);

            // Add marker
            addMarker(lat, lng, currentCity);

            // Add wind layer (simulated with arrows)
            addWindLayer();

            // Resize handler
            setTimeout(() => map.invalidateSize(), 500);
        }

        function addMarker(lat, lng, name) {
            // Clear old markers
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];

            const icon = L.divIcon({
                html: `<div style="
                    background: linear-gradient(135deg, #00d2ff, #3a7bd5);
                    width: 40px;
                    height: 40px;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 20px;
                    box-shadow: 0 0 30px rgba(0,210,255,0.5);
                    border: 2px solid rgba(255,255,255,0.2);
                ">📍</div>`,
                className: '',
                iconSize: [40, 40],
                iconAnchor: [20, 40]
            });

            const marker = L.marker([lat, lng], { icon }).addTo(map);
            marker.bindPopup(`
                <div style="color:#000;font-weight:700;font-size:16px;">
                    ${name}
                    <br>
                    <span style="font-weight:400;font-size:12px;color:#666;">
                        🕐 ${new Date().toLocaleTimeString('vi-VN')}
                    </span>
                </div>
            `);
            marker.openPopup();

            mapMarkers.push(marker);
        }

        // ============================================================
        // 3. WIND LAYER (Simulated)
        // ============================================================
        function addWindLayer() {
            if (windLayer) {
                map.removeLayer(windLayer);
                windLayer = null;
            }

            if (!showWind) return;

            // Create wind arrows using canvas
            const windData = [];
            const bounds = map.getBounds();
            const latStep = (bounds.getNorth() - bounds.getSouth()) / 10;
            const lngStep = (bounds.getEast() - bounds.getWest()) / 10;

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const lat = bounds.getSouth() + i * latStep + latStep / 2;
                    const lng = bounds.getWest() + j * lngStep + lngStep / 2;
                    const angle = (i * 45 + j * 30 + Date.now() / 50000) % 360;
                    const speed = 0.5 + Math.random() * 2;
                    windData.push({ lat, lng, angle, speed });
                }
            }

            // Draw wind arrows
            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;

            windLayer = L.canvasLayer({
                draw: function() {
                    const ctx = this.canvas.getContext('2d');
                    const size = this.canvas.width;
                    ctx.clearRect(0, 0, size, size);

                    // Draw wind arrows
                    windData.forEach((w, index) => {
                        const x = (w.lng - bounds.getWest()) / (bounds.getEast() - bounds.getWest()) * size;
                        const y = (bounds.getNorth() - w.lat) / (bounds.getNorth() - bounds.getSouth()) * size;

                        const angleRad = (w.angle * Math.PI) / 180;
                        const len = 8 + w.speed * 4;
                        const endX = x + len * Math.cos(angleRad);
                        const endY = y - len * Math.sin(angleRad);

                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(endX, endY);
                        ctx.strokeStyle = `hsla(200, 80%, 70%, ${0.3 + w.speed * 0.2})`;
                        ctx.lineWidth = 1.5 + w.speed * 0.5;
                        ctx.stroke();

                        // Arrowhead
                        const arrowSize = 5;
                        const a1 = angleRad + 0.5;
                        const a2 = angleRad - 0.5;
                        ctx.beginPath();
                        ctx.moveTo(endX, endY);
                        ctx.lineTo(endX - arrowSize * Math.cos(a1), endY + arrowSize * Math.sin(a1));
                        ctx.moveTo(endX, endY);
                        ctx.lineTo(endX - arrowSize * Math.cos(a2), endY + arrowSize * Math.sin(a2));
                        ctx.strokeStyle = `hsla(200, 80%, 70%, ${0.3 + w.speed * 0.2})`;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    });
                }
            });

            windLayer.addTo(map);

            // Animate wind layer
            function animateWind() {
                if (!showWind) return;
                if (windLayer) {
                    windLayer.redraw();
                }
                requestAnimationFrame(animateWind);
            }
            animateWind();
        }

        // ============================================================
        // 4. WEATHER DATA (OpenWeatherMap API)
        // ============================================================
        const API_KEY = 'b6907d289e10d714a6e88b30761fae0f';

        async function getWeather(city) {
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=vi`
                );
                if (!response.ok) throw new Error('Không tìm thấy thành phố');
                const data = await response.json();
                return data;
            } catch (error) {
                throw error;
            }
        }

        async function getForecast(city) {
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=vi&cnt=5`
                );
                if (!response.ok) throw new Error('Không thể lấy dự báo');
                const data = await response.json();
                return data;
            } catch (error) {
                throw error;
            }
        }

        function getWeatherEmoji(weatherId, isNight = false) {
            if (weatherId >= 200 && weatherId < 300) return '⛈️';
            if (weatherId >= 300 && weatherId < 500) return '🌧️';
            if (weatherId >= 500 && weatherId < 600) return '🌧️';
            if (weatherId >= 600 && weatherId < 700) return '❄️';
            if (weatherId >= 700 && weatherId < 800) return '🌫️';
            if (weatherId === 800) return isNight ? '🌙' : '☀️';
            if (weatherId === 801) return isNight ? '☁️' : '🌤️';
            if (weatherId === 802) return '⛅';
            if (weatherId >= 803) return '☁️';
            return '🌈';
        }

        function getWindDirection(deg) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return dirs[Math.round(deg / 45) % 8];
        }

        async function updateWeather(city) {
            const weatherContent = document.getElementById('weatherContent');
            const forecastList = document.getElementById('forecastList');

            try {
                // Show loading
                weatherContent.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải dữ liệu...</p>
                    </div>
                `;
                forecastList.innerHTML = `
                    <div class="loading" style="padding:10px;font-size:12px;">
                        Đang tải...
                    </div>
                `;

                const [weather, forecast] = await Promise.all([
                    getWeather(city),
                    getForecast(city)
                ]);

                // Update weather
                const isNight = new Date().getHours() < 6 || new Date().getHours() > 18;
                const emoji = getWeatherEmoji(weather.weather[0].id, isNight);

                weatherContent.innerHTML = `
                    <div class="weather-main">
                        <div class="weather-icon">${emoji}</div>
                        <div>
                            <div class="weather-temp">${Math.round(weather.main.temp)}°C</div>
                            <div class="weather-desc">${weather.weather[0].description}</div>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="weather-detail-item">
                            <div class="label">🌡️ Cảm giác</div>
                            <div class="value">${Math.round(weather.main.feels_like)}°C</div>
                        </div>
                        <div class="weather-detail-item">
                            <div class="label">💧 Độ ẩm</div>
                            <div class="value">${weather.main.humidity}%</div>
                        </div>
                        <div class="weather-detail-item">
                            <div class="label">💨 Gió</div>
                            <div class="value">${Math.round(weather.wind.speed * 3.6)} km/h</div>
                        </div>
                        <div class="weather-detail-item">
                            <div class="label">🧭 Hướng gió</div>
                            <div class="value">${getWindDirection(weather.wind.deg)}</div>
                        </div>
                        <div class="weather-detail-item">
                            <div class="label">☀️ Áp suất</div>
                            <div class="value">${weather.main.pressure} hPa</div>
                        </div>
                        <div class="weather-detail-item">
                            <div class="label">👁️ Tầm nhìn</div>
                            <div class="value">${(weather.visibility / 1000).toFixed(1)} km</div>
                        </div>
                    </div>
                `;

                // Update forecast
                forecastList.innerHTML = '';
                const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

                forecast.list.forEach((item, index) => {
                    const date = new Date(item.dt * 1000);
                    const day = days[date.getDay()];
                    const emojiF = getWeatherEmoji(item.weather[0].id);

                    const div = document.createElement('div');
                    div.className = 'forecast-item';
                    div.innerHTML = `
                        <div class="day">${day}</div>
                        <div class="icon">${emojiF}</div>
                        <div class="temp">
                            <span class="temp-high">${Math.round(item.main.temp_max)}°</span>
                            <span class="temp-low">${Math.round(item.main.temp_min)}°</span>
                        </div>
                    `;
                    forecastList.appendChild(div);
                });

                // Update map
                const lat = weather.coord.lat;
                const lng = weather.coord.lon;
                currentCity = city;

                if (map) {
                    map.setView([lat, lng], 8);
                    addMarker(lat, lng, city);
                } else {
                    initMap(lat, lng);
                }

                // Update search input
                document.getElementById('searchInput').value = city;

            } catch (error) {
                weatherContent.innerHTML = `
                    <div style="text-align:center;padding:30px;color:#ff6b6b;">
                        <div style="font-size:40px;margin-bottom:10px;">😅</div>
                        <p>${error.message}</p>
                        <p style="font-size:12px;color:rgba(255,255,255,0.3);margin-top:10px;">
                            Thử nhập tên thành phố khác
                        </p>
                    </div>
                `;
                forecastList.innerHTML = '';
            }
        }

        // ============================================================
        // 5. SEARCH & LOCATION
        // ============================================================
        document.getElementById('searchBtn').addEventListener('click', () => {
            const city = document.getElementById('searchInput').value.trim();
            if (city) updateWeather(city);
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('searchBtn').click();
            }
        });

        function getCurrentLocation() {
            if (!navigator.geolocation) {
                alert('Trình duyệt không hỗ trợ định vị!');
                return;
            }

            const btn = event.target;
            btn.textContent = '⏳ Đang tìm...';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const { latitude, longitude } = position.coords;

                    try {
                        // Reverse geocode
                        const response = await fetch(
                            `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric`
                        );
                        const data = await response.json();
                        const city = data.name;

                        if (map) {
                            map.setView([latitude, longitude], 10);
                            addMarker(latitude, longitude, city);
                        } else {
                            initMap(latitude, longitude);
                        }

                        await updateWeather(city);
                        btn.textContent = '📍 Vị trí của tôi';
                        btn.disabled = false;

                    } catch (error) {
                        alert('Không thể lấy thông tin thành phố!');
                        btn.textContent = '📍 Vị trí của tôi';
                        btn.disabled = false;
                    }
                },
                (error) => {
                    alert('Không thể lấy vị trí! Vui lòng cho phép truy cập vị trí.');
                    btn.textContent = '📍 Vị trí của tôi';
                    btn.disabled = false;
                }
            );
        }

        // ============================================================
        // 6. MAP CONTROLS
        // ============================================================
        function zoomIn() {
            if (map) map.zoomIn();
        }

        function zoomOut() {
            if (map) map.zoomOut();
        }

        function resetMapView() {
            if (map && currentCity) {
                updateWeather(currentCity);
            }
        }

        function toggleWindLayer() {
            showWind = !showWind;
            const btn = document.getElementById('toggleWindLayer');
            btn.classList.toggle('active');

            if (showWind) {
                addWindLayer();
            } else {
                if (windLayer) {
                    map.removeLayer(windLayer);
                    windLayer = null;
                }
            }
        }

        function toggleTempLayer() {
            showTemp = !showTemp;
            const btn = document.getElementById('toggleTempLayer');
            btn.classList.toggle('active');

            // Simulated temperature overlay
            if (showTemp) {
                // Add a simple heatmap simulation
                if (tempLayer) {
                    map.removeLayer(tempLayer);
                    tempLayer = null;
                }

                // Create a semi-transparent overlay with temperature colors
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 200;

                tempLayer = L.canvasLayer({
                    draw: function() {
                        const ctx = this.canvas.getContext('2d');
                        const size = this.canvas.width;
                        ctx.clearRect(0, 0, size, size);

                        // Draw gradient circles simulating temperature
                        const bounds = map.getBounds();
                        const centerLat = (bounds.getNorth() + bounds.getSouth()) / 2;
                        const centerLng = (bounds.getEast() + bounds.getWest()) / 2;

                        for (let i = 0; i < 12; i++) {
                            const lat = bounds.getSouth() + Math.random() * (bounds.getNorth() - bounds.getSouth());
                            const lng = bounds.getWest() + Math.random() * (bounds.getEast() - bounds.getWest());

                            const x = (lng - bounds.getWest()) / (bounds.getEast() - bounds.getWest()) * size;
                            const y = (bounds.getNorth() - lat) / (bounds.getNorth() - bounds.getSouth()) * size;

                            const radius = 20 + Math.random() * 30;
                            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                            const hue = 200 + Math.random() * 40;
                            gradient.addColorStop(0, `hsla(${hue}, 80%, 60%, 0.15)`);
                            gradient.addColorStop(0.5, `hsla(${hue + 20}, 80%, 50%, 0.08)`);
                            gradient.addColorStop(1, `hsla(${hue + 40}, 80%, 40%, 0)`);

                            ctx.beginPath();
                            ctx.arc(x, y, radius, 0, Math.PI * 2);
                            ctx.fillStyle = gradient;
                            ctx.fill();
                        }
                    }
                });

                tempLayer.addTo(map);

                // Animate temp layer
                function animateTemp() {
                    if (!showTemp) return;
                    if (tempLayer) {
                        tempLayer.redraw();
                    }
                    setTimeout(animateTemp, 2000);
                }
                animateTemp();

            } else {
                if (tempLayer) {
                    map.removeLayer(tempLayer);
                    tempLayer = null;
                }
            }
        }

        // ============================================================
        // 7. AUTO-LOAD & INIT
        // ============================================================
        // Load default city on start
        window.addEventListener('load', () => {
            updateWeather('Hanoi');
        });

        // Handle resize for map
        window.addEventListener('resize', () => {
            if (map) {
                setTimeout(() => map.invalidateSize(), 300);
            }
        });

        console.log('🌤️ WeatherHub loaded!');
        console.log('📍 Tìm kiếm thành phố để xem thời tiết + map');
        console.log('💨 Bật/tắt lớp gió và nhiệt độ trên map');
        console.log('🕐 Đồng hồ hiển thị thời gian thực');
    </script>
</body>
